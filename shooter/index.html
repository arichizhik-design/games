<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Blocky Rivals</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game"></div>

  <!-- in-game HUD -->
  <div id="hud" class="hidden">
    <div id="scoreTop"></div>
    <div id="killfeed"></div>
    <div id="crosshair"><i class="ch t"></i><i class="ch b"></i><i class="ch l"></i><i class="ch r"></i><i class="dot"></i></div>
    <div id="hitmarker"><i></i><i></i><i></i><i></i></div>
    <div id="scope"><div class="lens"></div></div>
    <div id="vignette"></div>
    <div id="dmgDirs"></div>
    <div id="center"><div id="bigMsg"></div><div id="smallMsg"></div></div>
    <div id="killMsg"></div>
    <div id="health"><div class="label">HEALTH</div><div class="bar"><div id="hpFill"></div></div><div id="hpNum">100</div></div>
    <div id="ammo"><div id="wName"></div><div id="ammoNum"></div><div id="reloadBar"><div id="reloadFill"></div></div></div>
    <div id="slots"></div>
    <div id="dmgNums"></div>
  </div>

  <!-- touch controls (phones / tablets) -->
  <div id="touch" class="hidden">
    <div id="stick"><div id="knob"></div></div>
    <button class="tbtn" id="tFire">FIRE</button>
    <button class="tbtn" id="tAim">AIM</button>
    <button class="tbtn" id="tJump">JUMP</button>
    <button class="tbtn" id="tReload">R</button>
    <button class="tbtn" id="tSwap">⇄</button>
    <button class="tbtn" id="tPause">II</button>
  </div>

  <!-- pause -->
  <div id="pause" class="hidden">
    <div class="card">
      <h2>Paused</h2>
      <button id="resumeBtn" class="big">Resume</button>
      <button id="quitBtn">Leave match</button>
    </div>
  </div>

  <!-- end of match -->
  <div id="endScreen" class="hidden">
    <div class="card">
      <h2 id="endTitle"></h2>
      <div id="endBody"></div>
      <button id="againBtn" class="big">Play again</button>
      <button id="menuBtn">Menu</button>
    </div>
  </div>

  <!-- main menu -->
  <div id="menu">
    <div id="menuPanel">
      <h1>BLOCKY <span>RIVALS</span></h1>
      <div id="tabs">
        <button data-tab="play" class="on">Play</button>
        <button data-tab="loadout">Loadout</button>
        <button data-tab="avatar">Avatar</button>
      </div>

      <div class="tab" id="tab-play">
        <div class="label">Mode</div>
        <div class="row" id="modeRow">
          <button data-mode="duel" class="card-btn"><b>⚔️ Duel</b><small>1v1 against a bot. First to 5 rounds wins.</small></button>
          <button data-mode="ffa" class="card-btn"><b>💥 Free for All</b><small>You and 5 bots. First to 15 eliminations wins.</small></button>
        </div>
        <div class="label">Bot skill</div>
        <div class="row pills" id="diffRow">
          <button data-diff="easy">Easy</button>
          <button data-diff="normal">Normal</button>
          <button data-diff="hard">Hard</button>
        </div>
        <div class="label">Mouse sensitivity <span id="sensVal"></span></div>
        <input type="range" id="sens" min="0.2" max="3" step="0.1">
        <button id="startBtn" class="big">PLAY</button>
        <div class="help" id="help">
          <b>WASD</b> move · <b>Mouse</b> look · <b>Click</b> shoot · <b>Right click</b> aim<br>
          <b>Space</b> jump · <b>Shift</b> sprint · <b>R</b> reload · <b>1–4</b> / wheel switch · <b>G</b> grenade · <b>Esc</b> pause
        </div>
      </div>

      <div class="tab hidden" id="tab-loadout"></div>
      <div class="tab hidden" id="tab-avatar"></div>
    </div>
    <div id="previewHint">drag to spin</div>
  </div>

  <script src="three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
