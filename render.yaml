# Render setup (https://render.com): New → Blueprint, then pick this repo.
services:
  - type: web
    name: ice-cream-tycoon
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # seals the progress backups in players' browsers; Render makes it once and keeps it
      - key: SAVE_SECRET
        generateValue: true
